version: 2

project_name: tildewire

builds:
  - id: tildewire
    main: .
    binary: tildewire
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    ids:
      - tildewire
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/RELEASE_NOTES.md
      - scripts/install.sh
      - scripts/install-local.sh

homebrew_casks:
  - name: tildewire
    ids:
      - default
    binaries:
      - tildewire
    repository:
      owner: AIluffy
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/AIluffy/tildewire
    description: Terminal daily technical signal radar for developers.
    url:
      verified: github.com/AIluffy/tildewire/
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tildewire"]
          end

nfpms:
  - id: linux-packages
    package_name: tildewire
    ids:
      - tildewire
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    maintainer: AIluffy
    vendor: tildewire
    homepage: https://github.com/AIluffy/tildewire
    license: MIT
    description: Terminal daily technical signal radar for developers.

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
