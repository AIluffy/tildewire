name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/tildewire .
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/tw ./cmd/tw
